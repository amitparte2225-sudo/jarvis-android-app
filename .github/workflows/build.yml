```yaml
name: Build JARVIS Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          for f in \
            pubspec.yaml \
            lib/main.dart \
            lib/app.dart \
            lib/core/services/gemini_service.dart \
            lib/features/chat/chat_screen.dart \
            lib/features/home/home_shell.dart \
            test/memory_store.dart \
            test/pin_service_test.dart \
            test/app_flow_test.dart
          do
            if [ ! -f "$f" ]; then
              echo "MISSING FILE: $f"
              exit 1
            fi
          done
          echo "All project files found."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create \
            --platforms=android \
            --project-name jarvis_app \
            --org com.amit.jarvis .
          rm -f test/widget_test.dart

      - name: Add Android Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          grep 'android.permission.INTERNET' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
```
